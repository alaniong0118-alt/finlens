services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finlens
      POSTGRES_USER: finlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finlens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlens -d finlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finlens-postgres-data:
